<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NULLIFIER — Animasi Boss | NUMERA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--fg:#efe9ff;--gold:#ffd166;--cy:#5ee7ff;--vi:#b48cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Exo 2",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 45%,#1a1038 0%,#0a0718 55%,#05040c 100%)}
canvas{position:absolute;inset:0;cursor:pointer}
.cap{position:absolute;left:16px;top:12px;right:16px;pointer-events:none}
.cap h1{font-family:Cinzel,serif;font-size:clamp(18px,4vw,28px);margin:0;letter-spacing:.12em;color:var(--gold)}
.cap p{margin:4px 0 0;font-size:clamp(12px,2.6vw,14px);max-width:520px;opacity:.8;line-height:1.4}
.hint{position:absolute;right:14px;bottom:8px;font-size:11px;opacity:.5}
nav{display:flex;gap:8px;padding:10px 12px;justify-content:center;flex-wrap:wrap;background:#0b0816;border-top:1px solid #2c2150}
button{font:700 13px "Exo 2",sans-serif;color:var(--fg);background:#17102e;border:1px solid #3a2c6b;border-radius:8px;padding:9px 14px;cursor:pointer}
button.on{background:var(--gold);color:#2a1700;border-color:var(--gold)}
</style></head><body>
<div class="stage"><canvas id="c"></canvas><div class="cap"><h1 id="tt"></h1><p id="dd"></p></div><div class="hint">klik layar = pulse</div></div>
<nav id="nv"></nav>
<script>
const C=document.getElementById('c'),x=C.getContext('2d');
const NUM='0123456789'.split(''),SYM='+−×÷=≠≈±∞√∑∫∂∆πθλ'.split(''),FRM=['x²','a²+b²','e^iπ','∑n','∫dx','f(x)','sinθ','log x','n!','y=mx','Δx','lim','√x','πr²','dy/dx'],MIX=NUM.concat(SYM);
const hs=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
let W,H,S,dpr,cur=0,MO=0,P=0,CP={x:0,y:0},T0=performance.now();
function rs(){const r=C.parentElement.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';S=Math.min(W/760,H/700)}
addEventListener('resize',rs);rs();
function g(ch,px,py,sz,col,a,rot){x.save();x.globalAlpha=Math.max(0,a)*MO;x.fillStyle=col;x.font=`700 ${Math.max(6,sz)}px "Exo 2",monospace`;x.translate(px,py);if(rot)x.rotate(rot);x.fillText(ch,0,0);x.restore()}
function core(px,py,r,t){CP={x:px,y:py};x.save();x.globalAlpha=MO;
 const gl=x.createRadialGradient(px,py,0,px,py,r*3.4);gl.addColorStop(0,`rgba(255,230,150,${.55+.3*P})`);gl.addColorStop(.4,'rgba(255,170,60,.18)');gl.addColorStop(1,'rgba(255,170,60,0)');
 x.fillStyle=gl;x.beginPath();x.arc(px,py,r*3.4,0,7);x.fill();x.translate(px,py);
 for(let i=0;i<3;i++){x.save();x.rotate(t*(.6+i*.3)*(i%2?-1:1)+i);x.strokeStyle=i==1?'#5ee7ff':'#ffd166';x.globalAlpha=.8*MO;x.lineWidth=1.5;const q=r*(1.35-i*.25);x.strokeRect(-q,-q,2*q,2*q);x.restore()}
 x.shadowColor='#ffd166';x.shadowBlur=24;x.fillStyle='#fff3c4';x.beginPath();x.arc(0,0,r*.6*(1+.08*Math.sin(t*4)+.25*P),0,7);x.fill();
 x.shadowBlur=0;x.fillStyle='#7a3b00';x.font=`800 ${r*.85}px Cinzel,serif`;x.fillText('Σ',0,r*.04);x.restore()}
function eye(px,py,r,col){x.save();x.globalAlpha=MO;x.shadowColor=col;x.shadowBlur=14;x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.restore()}
const WS=[{set:NUM,col:'#ffd166',a0:-88,a1:-28,L:300,n:9,sz:22},{set:SYM,col:'#5ee7ff',a0:-22,a1:18,L:270,n:8,sz:21},{set:FRM,col:'#b48cff',a0:26,a1:62,L:200,n:6,sz:14}];
function wings(cx,cy,t){WS.forEach((w,k)=>{for(let sd=-1;sd<=1;sd+=2)for(let i=0;i<w.n;i++){
 const u=i/(w.n-1),ang=(w.a0+(w.a1-w.a0)*u)*Math.PI/180+Math.sin(t*1.6-k*.5)*.14*(1+P*2),len=w.L*S*(1-.45*Math.abs(u-.35)),m=Math.floor(len/(w.sz*S*1.2));
 for(let j=1;j<=m;j++){const r=j*len/m+18*S,v=j/m,a=ang+v*v*.35;
  g(w.set[(i*5+j*3+Math.floor(t*2+j*.5))%w.set.length],cx+sd*(Math.cos(a)*r+14*S),cy+Math.sin(a)*r,w.sz*S*(1-v*.4),w.col,(1-v*.7)*.9)}}})}
function prof(s){return Math.pow(Math.sin(Math.PI*Math.min(1,s*.85+.05)),.7)}
function ser(cx,cy,t,o){const pts=[];
 for(let i=0;i<=o.N;i++){const s=i/o.N;pts.push({s,x:cx+o.fx(s,t)*S,y:cy+(o.y0-(o.y0-o.y1)*s)*S})}
 pts.forEach((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(o.N,i+1)],ta=Math.atan2(b.y-a.y,b.x-a.x),nx=-Math.sin(ta),ny=Math.cos(ta),pr=prof(p.s),wd=(4+o.w*pr)*S,sz=(11+10*pr)*S;
  const rows=wd>o.th*S?[-1,0,1]:[0];
  rows.forEach(r=>g(o.set[(i*3+(r+1)*2+Math.floor(t*3-i*.3))%o.set.length],p.x+nx*r*wd*.85,p.y+ny*r*wd*.85,sz*(r?.8:1),o.col(p.s),.95-Math.abs(r)*.2));
  if(o.spike&&i%3==0)for(let sd=-1;sd<=1;sd+=2)g('∆',p.x+nx*sd*(wd+12*S),p.y+ny*sd*(wd+12*S),(10+9*pr)*S,'#ff9a3c',.85,ta+sd*1.5)});
 return pts}
function tri(px,py,a,b,c){const d=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]),l1=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/d,l2=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/d;return l1>=0&&l2>=0&&l1+l2<=1}
function mk(test,x0,x1,y0,y1,st,set){const r=[];let n=0;for(let yy=y0;yy<=y1;yy+=st)for(let xx=x0;xx<=x1;xx+=st){if(test(xx,yy)){r.push({x:xx,y:yy,ch:set[Math.floor(hs(n*3+1)*set.length)],ph:hs(n)*6.28});}n++}return r}
const dH=mk((a,b)=>tri(Math.abs(a),b,[0,-58],[26,6],[0,6]),-30,30,-60,8,8,MIX);
const sH=mk((a,b)=>(a/52)**2+((b+10)/42)**2<1||(a/17)**2+((b+50)/20)**2<1,-55,55,-72,34,9,MIX);
const wf=mk((a,b)=>{const ax=Math.abs(a);return (ax/72)**2+((b+60)/56)**2<1||(b>-30&&b<42&&ax<30-(b+30)/72*20)||tri(ax,b,[36,-100],[74,-172],[8,-112])||(ax/118)**2+((b-92)/92)**2<1||(ax/100)**2+((b-10)/38)**2<1},-122,122,-175,186,14,MIX).filter(p=>Math.hypot(Math.abs(p.x)-30,p.y+66)>13);
function motes(t,col){for(let i=0;i<45;i++)g(NUM[i%10],hs(i)*W,H+20-((t*(12+hs(i+9)*20)+hs(i+3)*H)%(H+40)),12*S+3,col,.07+.1*hs(i+5))}
function orbit(cx,cy,n,rx,ry,tl,sp,set,sz,col,t){for(let i=0;i<n;i++){const a=t*sp+6.283*i/n,ex=Math.cos(a)*rx,ey=Math.sin(a)*ry,dp=(Math.sin(a)+1)/2;
 g(set[(i*3+Math.floor(t))%set.length],cx+ex*Math.cos(tl)-ey*Math.sin(tl),cy+ex*Math.sin(tl)+ey*Math.cos(tl),sz*S*(.7+.5*dp),col,.4+.6*dp)}}
function lem(a,u){const s=Math.sin(u),d=1+s*s;return[a*Math.cos(u)/d,a*s*Math.cos(u)/d]}
const F=[
function(cx,cy,t){motes(t,'#9a86ff');
 for(let k=0;k<2;k++){const n=k?90:150,a=(k?190:262)*S;for(let i=0;i<n;i++){const u=i/n*6.283+t*(k?-.35:.4),[px,py]=lem(a,u),gl=Math.random()<.004?(Math.random()-.5)*18*S:0;
  g(MIX[(i*7+Math.floor(t*2+i*.1))%MIX.length],cx+px+gl,cy+py,(k?14:22)*S*(.8+.4*Math.sin(t*3+i*.3)),k?'#b48cff':'#efe9ff',(k?.55:.95)*(.75+.25*Math.sin(t*5+i)))}}
 for(let i=0;i<60;i++){const ph=(t*.22+i/60)%1,[bx,by]=lem(262*S,i*2.399),l=Math.hypot(bx,by)||1;g(NUM[i%10],cx+bx+bx/l*ph*90*S,cy+by+by/l*ph*90*S,13*S,'#b48cff',(1-ph)*.8)}
 x.save();x.globalAlpha=.7*MO;x.strokeStyle='#b48cff';x.setLineDash([4,8]);x.lineDashOffset=-t*20;x.beginPath();x.arc(cx,cy,34*S*(1+P*.5),0,7);x.stroke();x.restore();
 g('0',cx,cy,34*S,'#fff',.5+.5*Math.sin(t*6)*Math.sin(t*2.3),0);CP={x:cx,y:cy}},
function(cx,cy,t){cy+=24*S;motes(t,'#ffb347');
 const pts=ser(cx,cy,t,{N:90,y0:300,y1:-170,fx:(s,t)=>Math.sin(s*5.5-t*1.8)*62*(1-s*.35),w:20,th:9,set:MIX,spike:1,col:s=>`hsl(${28+s*30},95%,${58+s*14}%)`});
 const c=pts[38],h=pts[90];wings(c.x,c.y,t);ser(cx,cy,t,{N:90,y0:300,y1:-170,fx:(s,t)=>Math.sin(s*5.5-t*1.8)*62*(1-s*.35),w:20,th:9,set:MIX,spike:1,col:s=>`hsl(${28+s*30},95%,${58+s*14}%)`});
 x.save();x.translate(h.x,h.y);x.rotate(Math.sin(t*1.8)*.12);const op=(Math.sin(t*2)+1)*.5*.8;
 dH.forEach(p=>{for(let sd=-1;sd<=1;sd+=2)g(p.ch,sd*p.x*S,p.y*S,9*S,'#ffd166',.9)});
 for(let k=0;k<8;k++)for(let sd=-1;sd<=1;sd+=2){g(SYM[k%SYM.length],sd*(18+k*5)*S,(-10-k*7-k*k*.6)*S,(13-k)*S,'#ff7a2f',.9,sd*.4)}
 for(let k=1;k<7;k++)for(let sd=-1;sd<=1;sd+=2)g('∧',sd*(16-k*2.2)*S,(8+k*5+op*k*2)*S,9*S,'#fff3c4',.85);
 eye(-9*S,-24*S,3.4*S,'#ff3b30');eye(9*S,-24*S,3.4*S,'#ff3b30');x.restore();
 for(let i=0;i<24;i++){const ph=(t*.5+i/24)%1;g(NUM[i%10],h.x+Math.sin(i*5+t)*20*S,h.y+(8+ph*130)*S*-1+40*S,12*S,'#ff9a3c',(1-ph)*.8)}
 core(c.x,c.y,26*S,t)},
function(cx,cy,t){cy+=24*S;motes(t,'#5dffb0');
 const o={N:90,y0:310,y1:-150,fx:(s,t)=>Math.sin(s*9-t*2.2)*(100*(1-s)+16),w:26,th:11,set:MIX,col:s=>`hsl(${150+s*30},85%,${55+s*15}%)`};
 const pts=ser(cx,cy,t,o),c=pts[46],h=pts[90];wings(c.x,c.y,t);ser(cx,cy,t,o);
 x.save();x.translate(h.x,h.y);x.rotate(Math.sin(t*1.5)*.08);const ex=1+.08*Math.sin(t*2);
 sH.forEach(p=>g(p.ch,p.x*S*ex,p.y*S,9*S,p.y>-34?'#7dffc4':'#c5ffe4',.9));
 for(let k=0;k<7;k++){const f=k>3?(k-3)*2.5:0,fl=Math.sin(t*14)*2;for(let sd=-1;sd<=1;sd+=2)g('·',(sd*f+fl*(k>3?sd:1))*S,(-72-k*4)*S,12*S,'#ff4d6d',.9)}
 eye(-7*S,-50*S,3*S,'#ffe14d');eye(7*S,-50*S,3*S,'#ffe14d');x.restore();
 core(c.x,c.y,26*S,t)},
function(cx,cy,t){cy+=44*S;motes(t,'#7fd7ff');
 wings(cx,cy+30*S,t);orbit(cx,cy-30*S,22,285,265,0,-.25,FRM,13,'#b48cff',t);
 x.save();x.translate(cx,cy);const br=1+.015*Math.sin(t*2.2);
 wf.forEach(p=>{const sw=Math.sin(t*2+p.ph)*2.2*(p.y>-20?1:.4);g(p.ch,p.x*S*br,(p.y+sw)*S*br,10*S,`hsl(${200+p.y/4},80%,${p.y<0?82:66}%)`,.55+.4*Math.abs(Math.sin(t+p.ph)))});
 const gl=Math.sin(t*3)*.3+1;eye(-30*S,-66*S,5*S*gl,'#ff9d2e');eye(30*S,-66*S,5*S*gl,'#ff9d2e');x.restore();
 core(cx,cy-95*S,16*S,t);orbit(cx,cy-30*S,16,235,70,-.35,.6,SYM,22,'#5ee7ff',t);orbit(cx,cy-30*S,12,200,60,.4,-.8,NUM,20,'#ffd166',t)}];
const INFO=[['PROLOG — ∞','Nullifier belum punya tubuh. Hanya simbol tak terhingga yang berputar, retak dan berkedip di tengah kehampaan.'],['BOSS 1 — NAGA','Naga tersusun dari angka & simbol matematika. Equation Core berdenyut di dadanya; tiga pasang sayap rumus mengepak di belakang.'],['BOSS 2 — ULAR','Kobra berselimut hood angka. Tubuhnya melata dalam gelombang sinus, Equation Core melingkar di tengah badan.'],['BOSS 3 — SERIGALA','Serigala dari simbol-simbol dingin. Equation Core tertanam di dahi, simbol matematika mengorbit mengelilinginya.']];
const nv=document.getElementById('nv');
['∞ Prolog','🐉 Boss 1','🐍 Boss 2','Nullifier'].forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>set(i);nv.appendChild(b)});
function set(i){cur=i;MO=0;[...nv.children].forEach((b,k)=>b.classList.toggle('on',k==i));document.getElementById('tt').textContent='NULLIFIER · '+INFO[i][0];document.getElementById('dd').textContent=INFO[i][1]}
set(0);C.addEventListener('pointerdown',()=>P=1);
function frame(now){const t=(now-T0)/1000;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);MO=Math.min(1,MO+.03);x.textAlign='center';x.textBaseline='middle';
 F[cur](W/2,H/2,t);
 if(P>.02){x.save();x.globalAlpha=P*MO;x.strokeStyle='#ffd166';x.lineWidth=3;x.beginPath();x.arc(CP.x,CP.y,(1-P)*320*S,0,7);x.stroke();x.restore()}
 P*=.95;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
