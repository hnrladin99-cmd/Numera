<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMERA - Boss Ketiga: Serigala Equation Core</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px 14px;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(40,70,170,.38) 0%, transparent 62%),
      linear-gradient(180deg, #02040f 0%, #070c26 55%, #0b1440 100%);
    font-family: 'Exo 2', system-ui, sans-serif; color: #dbe8ff;
  }
  h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; margin: 0; letter-spacing: .12em; color: #bfe8ff; text-align: center; text-shadow: 0 0 16px rgba(95,200,255,.6); }
  h1 small { display: block; font-family: 'Exo 2', sans-serif; font-size: .8rem; letter-spacing: .06em; color: #ffd86b; margin-top: 4px; text-shadow: none; }
  .stage {
    width: min(860px, 97vw); border-radius: 18px; padding: 6px; box-sizing: border-box;
    background: rgba(4,8,30,.6); border: 1px solid rgba(110,190,255,.3);
    box-shadow: 0 0 60px rgba(70,150,255,.16) inset, 0 12px 44px rgba(0,0,0,.5);
  }
  canvas { width: 100%; height: auto; aspect-ratio: 760 / 540; display: block; border-radius: 12px; }
  .label { min-height: 1.4em; font-size: .95rem; opacity: .9; text-align: center; }
  .label b { color: #ffd86b; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 760px; }
  .row button {
    font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(255,216,107,.5); background: #14265e; color: #ffe9a8;
    transition: transform .12s, background .12s;
  }
  .row button:hover { background: #1f3a8c; transform: translateY(-2px); }
  .row button:active { transform: translateY(0); }
</style>
</head>
<body>

<h1>SERIGALA EQUATION CORE<small>Boss Ketiga — angka, simbol, dan rumus yang hidup</small></h1>

<div class="stage"><canvas id="wolf" aria-label="Animasi serigala boss NUMERA"></canvas></div>
<div class="label" id="label"></div>

<div class="row">
  <button data-set="idle">Siaga</button>
  <button data-set="howl">Raungan (intro)</button>
  <button data-set="attack">Serang</button>
  <button data-set="hit">Kena damage</button>
  <button data-set="defeat">Dikalahkan</button>
</div>

<script>
/*
  Cara pakai di game (canvas #wolf harus ada):
    WolfBoss.setState('idle' | 'howl' | 'attack' | 'hit' | 'defeat')
  'howl', 'attack', 'hit' otomatis kembali ke 'idle'. 'defeat' bertahan sampai state lain dipilih.
*/
(function () {
  'use strict';

  var canvas = document.getElementById('wolf');
  var ctx = canvas.getContext('2d');
  var W = 760, H = 540, D = 1, BX = 0, BY = 0;
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function fit() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * D);
    canvas.height = Math.round(H * D);
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---------- util ---------- */
  var FONT = "'Exo 2','Segoe UI Symbol','Cambria Math','Noto Sans Math',sans-serif";
  var NUMS = '0123456789';
  var POOL = NUMS + NUMS + '+−×÷=≠≈±∑∫π√∞ΔθλΩ∂∇≤≥%';
  var PI_DIG = '31415926535897932384626433832795';
  var ORB = ['∑', '∫', 'π', '√', '∞', 'Δ', 'θ', '∂', '≈', '≠', '±', 'λ', 'Ω', '∇', 'φ', 'μ'];
  var HALO_STR = '=+−×÷∑π∞∫√≈≠±Δ';

  function hs(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpP(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function hsl(h, s, l) { return 'hsl(' + Math.round(h) + ',' + s + '%,' + Math.round(clamp(l, 0, 100)) + '%)'; }
  function pick(i) { return POOL.charAt(Math.floor(hs(i) * POOL.length) % POOL.length); }

  /* ---------- state ---------- */
  var S = {
    t: 0, flow: 0, hit: 0, atk: -1, howl: -1, dis: 0, disTarget: 0,
    state: 'idle', particles: [], lite: false, wAcc: 0
  };

  var curFont = '';
  function setFont(sz) {
    var f = '600 ' + Math.round(sz) + 'px ' + FONT;
    if (f !== curFont) { ctx.font = f; curFont = f; }
  }
  function baseT() { ctx.setTransform(D, 0, 0, D, BX * D, BY * D); }

  var DO = { dx: 0, dy: 0, rot: 0, al: 1 };
  function dispOf(id) {
    var e = S.dis;
    var a = hs(id * 1.7 + 3) * 6.2832, sp = (0.35 + hs(id * 2.3 + 1)) * 300;
    DO.dx = Math.cos(a) * sp * e;
    DO.dy = Math.sin(a) * sp * e * 0.6 - 120 * e + 260 * e * e * (0.25 + hs(id * 0.9) * 0.75);
    DO.rot = (hs(id + 9) - 0.5) * 9 * e;
    DO.al = Math.max(0, 1 - e * 1.12);
    return DO;
  }

  function g(ch, x, y, size, rot, color, alpha, id) {
    if (id !== undefined) {
      if (S.dis > 0) { var d = dispOf(id); x += d.dx; y += d.dy; rot += d.rot; alpha *= d.al; }
      if (S.hit > 0 && hs(id * 3.7 + Math.floor(S.t * 28)) < S.hit * 0.7) color = '#ffffff';
    }
    if (alpha <= 0.02) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    setFont(size);
    if (rot) {
      var c = Math.cos(rot) * D, s = Math.sin(rot) * D;
      ctx.setTransform(c, s, -s, c, (x + BX) * D, (y + BY) * D);
      ctx.fillText(ch, 0, 0);
      baseT();
    } else {
      ctx.fillText(ch, x, y);
    }
  }

  function aura(x, y, r, hue, a) {
    var al = a * (1 - S.dis);
    if (al <= 0.01) return;
    var gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'hsla(' + hue + ',100%,55%,' + al + ')');
    gr.addColorStop(1, 'hsla(' + hue + ',100%,55%,0)');
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* ---------- Equation Core ---------- */
  function core(x, y, r, boost) {
    var d = S.dis;
    if (d >= 1) return;
    var vis = 1 - clamp((d - 0.55) / 0.45, 0, 1);
    var flare = d > 0 ? 1 + 2.4 * Math.sin(clamp(d * 1.8, 0, 1) * Math.PI / 2) : 1;
    var beat = 1 + 0.14 * Math.pow(Math.abs(Math.sin(S.t * 2.6)), 8) + 0.35 * S.hit;
    var rr = r * beat * flare * (0.4 + 0.6 * vis) * (1 + (boost || 0));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var gr = ctx.createRadialGradient(x, y, 0, x, y, rr * 3.6);
    gr.addColorStop(0, 'rgba(255,246,205,0.95)');
    gr.addColorStop(0.22, 'rgba(255,205,90,0.55)');
    gr.addColorStop(0.55, 'rgba(110,200,255,0.18)');
    gr.addColorStop(1, 'rgba(110,200,255,0)');
    ctx.globalAlpha = vis;
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, rr * 3.6, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(170,235,255,0.95)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 4]); ctx.lineDashOffset = -S.t * 18;
    ctx.beginPath(); ctx.arc(x, y, rr * 1.55, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([2, 6]); ctx.lineDashOffset = S.t * 14;
    ctx.beginPath(); ctx.arc(x, y, rr * 2.05, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'source-over';
    var og = ctx.createRadialGradient(x - rr * 0.3, y - rr * 0.3, 0, x, y, rr);
    og.addColorStop(0, '#ffffff'); og.addColorStop(0.5, '#ffe08a'); og.addColorStop(1, '#e8a317');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
    setFont(rr * 1.5);
    ctx.fillStyle = 'rgba(120,60,0,0.9)';
    ctx.fillText('=', x, y + rr * 0.05);
    ctx.restore();
  }

  /* ---------- sinar simbol ---------- */
  function beam(x, y, ang, len, p, hue, width) {
    if (p <= 0) return;
    var ext = Math.min(1, p * 1.7), fade = p < 0.65 ? 1 : Math.max(0, 1 - (p - 0.65) / 0.35);
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var fl = Math.floor(S.t * 22);
    var ex = x + ca * len * ext, ey = y + sa * len * ext;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var gr = ctx.createLinearGradient(x, y, ex, ey);
    gr.addColorStop(0, 'hsla(' + hue + ',100%,75%,0.6)');
    gr.addColorStop(1, 'hsla(' + hue + ',100%,60%,0)');
    ctx.globalAlpha = fade;
    ctx.strokeStyle = gr;
    ctx.lineWidth = 12 + width * 0.25;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (ex - x) * 0.85, y + (ey - y) * 0.85); ctx.stroke();
    ctx.restore();
    for (var j = 0; j < 56; j++) {
      var f = j / 55, d = len * ext * f;
      var sp = (hs(j * 3.1 + fl * 0.37) - 0.5) * width * (0.15 + f);
      var px = x + ca * d - sa * sp, py = y + sa * d + ca * sp;
      var ch = POOL.charAt(Math.floor(hs(j * 1.3 + fl) * POOL.length));
      g(ch, px, py, 18 - 9 * f + (j % 3) * 2, 0, hsl(hue + (j % 5) * 6, 100, 72 + (j % 4) * 5), (1 - f * 0.6) * fade);
    }
  }

  /* ---------- partikel ---------- */
  function spawnBurst(x, y, hue, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.2832, sp = 80 + Math.random() * 240;
      S.particles.push({
        x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 60,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0, max: 0.7 + Math.random() * 0.8,
        ch: POOL.charAt(Math.floor(Math.random() * POOL.length)), hue: hue + Math.random() * 40 - 20,
        sz: 14 + Math.random() * 10, grav: 260, wisp: false
      });
    }
  }
  function spawnWisp(x, y, fast) {
    S.particles.push({
      x: x, y: y, vx: (Math.random() - 0.5) * (fast ? 90 : 24), vy: -(fast ? 60 + Math.random() * 120 : 22 + Math.random() * 30),
      life: 0, max: 1.6 + Math.random() * 1.2, ch: POOL.charAt(Math.floor(Math.random() * POOL.length)),
      hue: 190 + Math.random() * 40, sz: 12 + Math.random() * 6, grav: 0, wisp: true
    });
  }
  function drawParticles() {
    for (var i = 0; i < S.particles.length; i++) {
      var p = S.particles[i];
      g(p.ch, p.x, p.y, p.sz, p.life * 2.5, hsl(p.hue, 95, 72), (1 - p.life / p.max) * (p.wisp ? 0.75 : 1));
    }
  }

  /* ---------- pemetaan koordinat serigala ---------- */
  var SC = 1.12, MX = 430, MY = 462;
  function mx(x) { return MX + (x - 318) * SC; }
  function my(y) { return MY + (y - 408) * SC; }
  function M(p) { return [mx(p[0]), my(p[1])]; }

  var NAMES = ['hip', 'chest', 'neckA', 'neckB', 'C', 'snA', 'snB', 'jwA', 'jwB', 'e1A', 'e1B', 'e2A', 'e2B',
               'core', 'eye', 'nose', 'tl0', 'tl1', 'tl2', 'tl3'];
  (function () {
    var pre = ['fn', 'ff', 'hn', 'hf'], k;
    for (k = 0; k < pre.length; k++) NAMES.push(pre[k] + 'Sh', pre[k] + 'Kn', pre[k] + 'Pw', pre[k] + 'To');
  })();

  function env() {
    var a = S.atk, w = 0, s = 0, h = 0, q = S.howl;
    if (a >= 0) {
      w = a < 0.3 ? smooth(a / 0.3) : (a < 0.45 ? 1 - smooth((a - 0.3) / 0.15) : 0);
      s = (a >= 0.3 && a <= 0.72) ? Math.sin(Math.PI * (a - 0.3) / 0.42) : 0;
    }
    if (q >= 0) h = q < 0.2 ? smooth(q / 0.2) : (q < 0.78 ? 1 : 1 - smooth((q - 0.78) / 0.22));
    return { w: w, s: s, h: h };
  }

  /* rangka serigala dalam koordinat lokal, lalu dipetakan ke kanvas */
  function rig(t, E) {
    var w = E.w, s = E.s, h = E.h, hit = S.hit;
    var fx = -86 * s + 16 * w + 16 * hit, rx = -30 * s + 10 * w + 10 * hit, cr = 18 * w + 6 * s;
    var br = Math.sin(t * 2.0) * (1 - h * 0.5);
    var P = {};
    P.hip = [410 + rx, 296 + cr * 0.35];
    P.chest = [300 + fx, 290 + cr + br * 1.5 - h * 8];
    P.neckA = [306 + fx, 280 + cr + br - h * 10];
    var na = lerp(-2.53, -1.95, h) - 0.45 * s + 0.2 * w + 0.4 * hit + 0.05 * Math.sin(t * 1.1);
    P.neckB = [P.neckA[0] + 72 * Math.cos(na), P.neckA[1] + 72 * Math.sin(na)];
    var hp = 2.91 + 0.75 * h - 0.15 * s + 0.1 * w + 0.35 * hit + 0.04 * Math.sin(t * 1.3);
    var f = [Math.cos(hp), Math.sin(hp)], pv = [Math.sin(hp), -Math.cos(hp)];
    P.C = [P.neckB[0] + f[0] * 6, P.neckB[1] + f[1] * 6];
    function hw(u, v) { return [P.C[0] + f[0] * u + pv[0] * v, P.C[1] + f[1] * u + pv[1] * v]; }
    var open = 0.05 + 0.03 * Math.sin(t * 2.4) + 0.55 * h + 0.62 * s + 0.2 * w + 0.35 * hit;
    P.snA = hw(14, 3); P.snB = hw(68, 9);
    P.jwA = hw(10, 15);
    var du = 50, dv = 8, c = Math.cos(open), sn = Math.sin(open);
    P.jwB = hw(10 + du * c - dv * sn, 15 + du * sn + dv * c);
    var tw = Math.sin(t * 0.7) > 0.6 ? 2.5 * Math.sin(t * 13) : 0;
    P.e1A = hw(-10, -22); P.e1B = hw(-26 + tw, -62);
    P.e2A = hw(6, -24); P.e2B = hw(10, -60);
    P.core = hw(8, -17); P.eye = hw(24, -6); P.nose = hw(70, 8);

    function leg(pre, shx, shy, pwx, bend, lift) {
      var sh = [shx, shy], pw = [pwx, 408 - lift];
      P[pre + 'Sh'] = sh; P[pre + 'Pw'] = pw;
      P[pre + 'Kn'] = [(sh[0] + pw[0]) / 2 + bend, sh[1] * 0.45 + pw[1] * 0.55];
      P[pre + 'To'] = [pw[0] - 18, pw[1]];
    }
    leg('fn', 300 + fx * 0.9, 318 + cr * 0.6, 288 + fx * 0.55 - 14 * s, 4, 30 * s);
    leg('ff', 270 + fx * 0.9, 316 + cr * 0.6, 258 + fx * 0.55 - 8 * s, 2, 22 * s);
    leg('hn', 400 + rx, 318, 400 + rx * 0.8, 22, 4 * s);
    leg('hf', 378 + rx, 316, 380 + rx * 0.8, 20, 0);

    var sw = Math.sin(t * 1.7);
    P.tl0 = [446 + rx, 286 + cr * 0.2];
    var a1 = -0.45 + 0.22 * sw - 0.4 * s - 0.25 * h;
    var a2 = a1 + 0.32 + 0.25 * Math.sin(t * 1.7 - 0.9);
    var a3 = a2 + 0.28 + 0.28 * Math.sin(t * 1.7 - 1.8);
    P.tl1 = [P.tl0[0] + 48 * Math.cos(a1), P.tl0[1] + 48 * Math.sin(a1)];
    P.tl2 = [P.tl1[0] + 42 * Math.cos(a2), P.tl1[1] + 42 * Math.sin(a2)];
    P.tl3 = [P.tl2[0] + 36 * Math.cos(a3), P.tl2[1] + 36 * Math.sin(a3)];

    var Q = {};
    for (var i = 0; i < NAMES.length; i++) Q[NAMES[i]] = M(P[NAMES[i]]);
    Q.open = open; Q.hp = hp; Q.na = na;
    Q.hwm = function (u, v) { return M(hw(u, v)); };
    return Q;
  }

  /* [titik A, titik B, radius A, radius B, gelap?, terang?] */
  var DEF = [
    ['hfSh', 'hfKn', 20, 11, 1, 0], ['hfKn', 'hfPw', 11, 7, 1, 0], ['hfPw', 'hfTo', 8, 6, 1, 0],
    ['ffSh', 'ffKn', 14, 10, 1, 0], ['ffKn', 'ffPw', 10, 7, 1, 0], ['ffPw', 'ffTo', 8, 6, 1, 0],
    ['tl0', 'tl1', 14, 10, 0, 0], ['tl1', 'tl2', 10, 6, 0, 0], ['tl2', 'tl3', 6, 2, 0, 0],
    ['hip', 'chest', 44, 50, 0, 0],
    ['hnSh', 'hnKn', 24, 12, 0, 0], ['hnKn', 'hnPw', 12, 8, 0, 0], ['hnPw', 'hnTo', 9, 6, 0, 0],
    ['fnSh', 'fnKn', 17, 11, 0, 0], ['fnKn', 'fnPw', 11, 8, 0, 0], ['fnPw', 'fnTo', 9, 6, 0, 0],
    ['neckA', 'neckB', 34, 26, 0, 0],
    ['C', null, 30, 30, 0, 1],
    ['e1A', 'e1B', 11, 2, 0, 1], ['e2A', 'e2B', 10, 2, 0, 1],
    ['snA', 'snB', 20, 11, 0, 1],
    ['jwA', 'jwB', 9, 6, 0, 1]
  ];
  var WG = null;
  function buildGlyphs(Q) {
    WG = DEF.map(function (d, ci) {
      var A = Q[d[0]], B = d[1] ? Q[d[1]] : null;
      var area = B ? Math.hypot(B[0] - A[0], B[1] - A[1]) * (d[2] + d[3]) * SC : Math.PI * d[2] * d[2] * SC * SC;
      var n = clamp(Math.round(area / 60), 5, 240), arr = [];
      for (var i = 0; i < n; i++) {
        arr.push({ a: hs(ci * 97 + i * 1.31), b: hs(ci * 57 + i * 2.17 + 5), ch: pick(ci * 31 + i * 3.7),
                   sz: 9 + hs(ci + i * 0.77) * 4, id: 2000 + ci * 300 + i });
      }
      return arr;
    });
  }

  var LVX = -0.508, LVY = -0.861;

  function drawBody(Q, t) {
    var ci, i, tt = S.t;
    for (ci = 0; ci < DEF.length; ci++) {
      var d = DEF[ci], A = Q[d[0]], B = d[1] ? Q[d[1]] : null, arr = WG[ci];
      var ra = d[2] * SC, rb = d[3] * SC;
      var dx = 0, dy = 0, L = 1, nx = 0, ny = 0, fa = 0;
      if (B) { dx = B[0] - A[0]; dy = B[1] - A[1]; L = Math.hypot(dx, dy) || 1; nx = -dy / L; ny = dx / L; fa = Math.atan2(dy, dx); }
      for (i = 0; i < arr.length; i++) {
        if (S.lite && (i & 1)) continue;
        var gl = arr[i], x, y, Nx, Ny, edge, rot;
        if (!B) {
          var th = gl.a * 6.2832, rho = Math.sqrt(gl.b);
          x = A[0] + Math.cos(th) * rho * ra; y = A[1] + Math.sin(th) * rho * ra;
          Nx = Math.cos(th) * rho; Ny = Math.sin(th) * rho; edge = rho;
          rot = (hs(gl.id) - 0.5) * 1.2;
        } else {
          var r = ra + (rb - ra) * gl.a, vv = gl.b * 2 - 1;
          x = A[0] + dx * gl.a + nx * vv * r; y = A[1] + dy * gl.a + ny * vv * r;
          var sg = vv < 0 ? -1 : 1;
          Nx = nx * sg * Math.abs(vv); Ny = ny * sg * Math.abs(vv); edge = Math.abs(vv);
          rot = fa + (hs(gl.id) - 0.5) * 0.9;
        }
        x += 1.2 * Math.sin(tt * 2.3 + gl.id * 0.7);
        y += 1.0 * Math.cos(tt * 2.0 + gl.id * 0.9);
        var bright = clamp(Nx * LVX + Ny * LVY, 0, 1);
        var l = 18 + 44 * bright + 20 * Math.pow(edge, 3) * (0.3 + bright) + 10 * hs(gl.id * 1.3);
        if (d[4]) l *= 0.55;
        if (d[5]) l += 6;
        var hue = 224 - 40 * bright + 10 * hs(gl.id * 2.1);
        g(gl.ch, x, y, gl.sz * SC, rot, hsl(hue, Math.round(78 + 15 * bright), l), 0.97, gl.id);
      }
    }
  }

  /* ---------- rambut / surai berkibar dari glyph ---------- */
  function strand(rx, ry, len, n, k, hue, fs, lift, idb, wm) {
    var tt = S.t;
    function pos(s) {
      return [rx + len * s * wm,
              ry - lift * Math.sin(s * 2.8) + (7 + 4 * hs(k)) * Math.sin(tt * 2.4 - s * 5 + k * 1.3) * s + 16 * s * s];
    }
    for (var i = 0; i < n; i++) {
      var s = i / (n - 1);
      var p1 = pos(s), p2 = pos(Math.min(1, s + 0.06));
      var ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);

  }

  function drawStrands(Q, E) {

    }

      var rt = lerpP(Q.tl1, Q.tl3, k / 3);

  /* ---------- latar: hujan angka + lingkaran sihir ---------- */
  function drawBackdrop(t, E, live) {
    var i;
    if (!S.lite) {
      for (i = 0; i < 38; i++) {
        var sp = 30 + 60 * hs(i * 1.1), x = hs(i * 1.7) * W, y = (hs(i * 2.3) * H + t * sp) % H;
        g(NUMS.charAt(Math.floor(hs(i * 5.1 + Math.floor(t * 0.5)) * 10) % 10), x, y, 14 + 6 * hs(i * 3.3), 0,
          hsl(225 + 30 * hs(i), 80, 60), (0.08 + 0.12 * hs(i * 3.1)) * live);
      }
    }
    aura(MX, my(300), 340, 225, 0.24);
    aura(MX, my(420), 270, 195, 0.18);

    var cx = MX + 10, cy = my(414), pulse = 1 + 0.08 * E.s + 0.15 * E.h + 0.1 * E.w;
    var rx1 = 330 * pulse, ry1 = 52 * pulse, rx2 = 250 * pulse, ry2 = 39 * pulse;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = hsl(200, 90, 65);
    ctx.globalAlpha = 0.35 * live;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx1, ry1, 0, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.25 * live;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx2, ry2, 0, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.28 * live;
    ctx.strokeStyle = hsl(260, 90, 70);
    var rot = t * 0.18, tr, v;
    for (tr = 0; tr < 2; tr++) {
      ctx.beginPath();
      for (v = 0; v < 3; v++) {
        var a = rot + tr * Math.PI / 3 + v * 2.0944;
        var px = cx + Math.cos(a) * rx2 * 0.96, py = cy + Math.sin(a) * ry2 * 0.96;
        if (v) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
    for (i = 0; i < 30; i++) {
      var aa = i / 30 * 6.2832 + t * 0.2;
      g(ORB[i % ORB.length], cx + Math.cos(aa) * (rx1 + rx2) / 2, cy + Math.sin(aa) * (ry1 + ry2) / 2, 15, 0,
        hsl(200 + 30 * Math.sin(aa), 90, 72), 0.5 * live);
    }
  }

  /* ---------- cincin simbol 3D yang mengorbit ---------- */
  function ring3(cx, cy, R, phi, roll, items, front, size, hue, trail, speed, idb) {
    var n = items.length, cr = Math.cos(roll), sr = Math.sin(roll), cp = Math.cos(phi), sp = Math.sin(phi);
    for (var i = 0; i < n; i++) {
      for (var k = 0; k <= trail; k++) {
        var th = i / n * 6.2832 + S.flow * speed - k * 0.08;
        var x0 = R * Math.cos(th), y0 = R * Math.sin(th) * cp, z = Math.sin(th) * sp;
        if ((z >= 0) !== front) continue;
        var x = cx + x0 * cr - y0 * sr, y = cy + x0 * sr + y0 * cr;
        var sz = size * (0.8 + 0.35 * z) * (k ? 0.8 : 1);
        var al = (front ? 0.95 : 0.4) * (k ? 0.35 / k : 1);
        g(k ? pick(i * 5 + k * 7) : items[i], x, y, sz, 0, hsl(hue + 6 * i % 60, 90, 76), al, idb + i * 8 + k);
      }
    }
  }
  var DIG_ITEMS = PI_DIG.split('');

  function drawRings(Q, E, front) {
    var rs = 1 - 0.5 * E.w - 0.25 * E.s + 0.35 * S.hit + 0.25 * E.h;
    var oy = (Q.chest[1] + Q.hip[1]) / 2 - 8;
    ring3(MX + 10, oy, 270 * rs, 1.12, -0.18, ORB, front, 28, 195, S.lite ? 0 : 3, 0.5, 11000);
    ring3(MX + 10, oy, 215 * rs, -0.9, 0.42, DIG_ITEMS, front, 19, 285, 0, -0.7, 12000);
  }

  function drawHalo(Q, t, live) {
    var c = Q.C, R = 64 * SC, i;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hsl(195, 90, 70); ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.35 * live;
    ctx.setLineDash([3, 5]); ctx.lineDashOffset = -t * 20;
    ctx.beginPath(); ctx.arc(c[0], c[1], R, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.2 * live;
    ctx.beginPath(); ctx.arc(c[0], c[1], R * 1.18, 0, 6.2832); ctx.stroke();
    ctx.restore();
    for (i = 0; i < 14; i++) {
      var a = i / 14 * 6.2832 - S.flow * 0.6;
      g(HALO_STR.charAt(i), c[0] + Math.cos(a) * R * 1.09, c[1] + Math.sin(a) * R * 1.09, 15, a + 1.57,

  /* ---------- wajah: taring, mata, urat cahaya, inti di dahi ---------- */
  function poly(pts, fill, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = fill;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function polyAt(pts, f) {
    var tot = 0, seg = [], i;
    for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); tot += l; }
    var d = f * tot;
    for (i = 0; i < seg.length; i++) {
      if (d <= seg[i] || i === seg.length - 1) {
        var u = seg[i] ? clamp(d / seg[i], 0, 1) : 0;
        return lerpP(pts[i], pts[i + 1], u);
      }
      d -= seg[i];
    }
    return pts[0];
  }

  function drawFace(Q, E, t, live) {
    var open = Q.open, i;
    // taring atas
    var snA = Q.snA, snB = Q.snB;
    var fdx = snB[0] - snA[0], fdy = snB[1] - snA[1], fl = Math.hypot(fdx, fdy) || 1;
    var fnx = -fdy / fl, fny = fdx / fl;
    if (fny < 0) { fnx = -fnx; fny = -fny; }            // arah "bawah" pada kepala
    var ta = live;
    if (ta > 0.05) {
      for (i = 0; i < 3; i++) {
        var f = 0.62 + i * 0.16;
        var bx = lerp(snA[0], snB[0], f) + fnx * 14 * SC, by = lerp(snA[1], snB[1], f) + fny * 14 * SC;
        var ln = (5 + 9 * open) * SC;
        poly([[bx - fdx / fl * 2.2 * SC, by - fdy / fl * 2.2 * SC], [bx + fdx / fl * 2.2 * SC, by + fdy / fl * 2.2 * SC],
              [bx + fnx * ln, by + fny * ln]], '#f5fbff', ta);
      }
      // taring bawah
      var jd0 = Q.jwA, jd1 = Q.jwB;
      var jdx = jd1[0] - jd0[0], jdy = jd1[1] - jd0[1], jl = Math.hypot(jdx, jdy) || 1;
      var ux = -jdy / jl, uy = jdx / jl;
      if (uy > 0) { ux = -ux; uy = -uy; }                 // arah "atas" pada rahang
      for (i = 0; i < 2; i++) {
        var f2 = 0.7 + i * 0.22;
        var qx = lerp(jd0[0], jd1[0], f2) + ux * 4 * SC, qy = lerp(jd0[1], jd1[1], f2) + uy * 4 * SC;
        poly([[qx - jdx / jl * 1.8 * SC, qy - jdy / jl * 1.8 * SC], [qx + jdx / jl * 1.8 * SC, qy + jdy / jl * 1.8 * SC],
              [qx + ux * 6 * SC, qy + uy * 6 * SC]], '#f5fbff', ta * clamp(open * 4, 0, 1));
      }
      // hidung
      ctx.save(); ctx.globalAlpha = ta; ctx.fillStyle = '#050a28';
      ctx.beginPath(); ctx.ellipse(Q.nose[0], Q.nose[1], 6 * SC, 4.5 * SC, Q.hp, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(150,230,255,0.8)';
      ctx.beginPath(); ctx.arc(Q.nose[0] - 1.5, Q.nose[1] - 1.5, 1.4 * SC, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // mata menyala (berkedip, menyipit saat kena damage / meraung)
    var ph = t % 4.6, blink = ph > 4.45 ? 1 - Math.abs((ph - 4.525) / 0.075) : 0;
    var shut = clamp(Math.max(blink, S.hit * 0.8, E.h * 0.85, S.dis * 2), 0, 1);
    var wide = 1 + 0.3 * E.s + 0.2 * E.w;
    var eo = Math.max(0.08, 1 - shut) * wide;
    var ec = Q.eye, alpha = Q.hp, axis = alpha + 0.4 - Math.PI;
    var ax = Math.cos(axis) * 9 * SC, ay = Math.sin(axis) * 9 * SC;
    if (live > 0.1) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var egr = ctx.createRadialGradient(ec[0], ec[1], 0, ec[0], ec[1], 26 * SC);
      egr.addColorStop(0, 'rgba(255,200,80,' + (0.55 * live * eo) + ')');
      egr.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = egr;
      ctx.beginPath(); ctx.arc(ec[0], ec[1], 26 * SC, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = live;
      var px = -Math.sin(axis) * 5 * SC * eo, py = Math.cos(axis) * 5 * SC * eo;
      ctx.beginPath();
      ctx.moveTo(ec[0] - ax, ec[1] - ay);
      ctx.quadraticCurveTo(ec[0] + px, ec[1] + py, ec[0] + ax, ec[1] + ay);
      ctx.quadraticCurveTo(ec[0] - px * 0.5, ec[1] - py * 0.5, ec[0] - ax, ec[1] - ay);
      var fg = ctx.createLinearGradient(ec[0] - ax, ec[1] - ay, ec[0] + ax, ec[1] + ay);
      fg.addColorStop(0, '#ffb340'); fg.addColorStop(1, '#fff3b0');
      ctx.fillStyle = fg; ctx.fill();
      ctx.fillStyle = '#2a1200';
      ctx.beginPath(); ctx.ellipse(ec[0] + ax * 0.15, ec[1] + ay * 0.15, 1.3 * SC, 3.6 * SC * eo, axis + 1.4, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // urat cahaya dari inti
    var cpt = Q.core;
    var NUx = -Math.sin(Q.na), NUy = Math.cos(Q.na);
    var nm = lerpP(Q.neckB, Q.neckA, 0.4);
    var veins = [
      [cpt, Q.hwm(18, -13), Q.hwm(34, -6), Q.hwm(52, -1), Q.hwm(66, 5)],
      [cpt, Q.hwm(-8, -20), Q.hwm(-26, -8), [nm[0] + NUx * 10 * SC, nm[1] + NUy * 10 * SC],
       [Q.chest[0] - 6 * SC, Q.chest[1] - 34 * SC]],
      [cpt, Q.hwm(0, -28), lerpP(Q.e1A, Q.e1B, 0.6)]
    ];
    var vl = live * (1 - clamp(S.dis * 2, 0, 1));
    if (vl > 0.05) {
      var vi, vj;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      for (vi = 0; vi < veins.length; vi++) {
        var vp = veins[vi];
        ctx.strokeStyle = 'rgba(110,200,255,0.18)'; ctx.lineWidth = 6 * SC; ctx.globalAlpha = vl;
        ctx.beginPath(); ctx.moveTo(vp[0][0], vp[0][1]);
        for (vj = 1; vj < vp.length; vj++) ctx.lineTo(vp[vj][0], vp[vj][1]);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,214,120,0.8)'; ctx.lineWidth = 1.8 * SC;
        ctx.beginPath(); ctx.moveTo(vp[0][0], vp[0][1]);
        for (vj = 1; vj < vp.length; vj++) ctx.lineTo(vp[vj][0], vp[vj][1]);
        ctx.stroke();
        for (vj = 0; vj < 3; vj++) {
          var pp = polyAt(vp, (t * 0.5 + vj / 3 + vi * 0.2) % 1);
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath(); ctx.arc(pp[0], pp[1], 2.6 * SC, 0, 6.2832); ctx.fill();
        }
      }
      ctx.restore();
      for (vi = 0; vi < veins.length; vi++) {
        for (vj = 1; vj < veins[vi].length - 1; vj++) {
          g('=', veins[vi][vj][0], veins[vi][vj][1], 10 * SC, 0, '#ffe9a8', 0.9, 13000 + vi * 10 + vj);
        }
      }
    }

    // soket inti di dahi
    if (live > 0.05) {
      ctx.save();
      ctx.globalAlpha = live;
      ctx.fillStyle = 'rgba(4,8,36,0.95)';
      ctx.beginPath(); ctx.arc(cpt[0], cpt[1], 17 * SC, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2.2 * SC;
      ctx.beginPath(); ctx.arc(cpt[0], cpt[1], 17 * SC, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = '#f2c14e';
      for (i = 0; i < 6; i++) {
        var pa = i / 6 * 6.2832 + t * 0.4;
        var cx0 = cpt[0] + Math.cos(pa) * 17 * SC, cy0 = cpt[1] + Math.sin(pa) * 17 * SC;
        ctx.beginPath();
        ctx.moveTo(cx0 + Math.cos(pa + 1.57) * 2.4 * SC, cy0 + Math.sin(pa + 1.57) * 2.4 * SC);
        ctx.lineTo(cx0 + Math.cos(pa - 1.57) * 2.4 * SC, cy0 + Math.sin(pa - 1.57) * 2.4 * SC);
        ctx.lineTo(cx0 + Math.cos(pa) * 8 * SC, cy0 + Math.sin(pa) * 8 * SC);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    core(cpt[0], cpt[1], 10 * SC, 0.9 * E.w + 0.35 * E.s + 0.5 * E.h);
  }

  /* ---------- efek tambahan ---------- */
  function drawCharge(Q, E) {
    if (E.w < 0.05) return;
    var c = Q.core;
    for (var i = 0; i < 14; i++) {
      var a = i / 14 * 6.2832 + S.t * 3 + hs(i) * 2;
      var r = lerp(170, 18, E.w) * (0.7 + 0.3 * hs(i + 4));
      g(pick(i * 3 + 1), c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r * 0.8, 16, a + 1.57, hsl(45 + 10 * (i % 4), 100, 75), 0.9 * E.w);
    }
  }
  function drawShock(Q) {
    if (S.howl < 0.2) return;
    var c = Q.core;
    for (var j = 0; j < 3; j++) {
      var qq = S.howl * 1.6 - 0.2 - j * 0.25;
      if (qq <= 0 || qq >= 1) continue;
      var rad = 40 + 520 * qq, al = (1 - qq) * 0.9;
      for (var i = 0; i < 44; i++) {
        var a = i / 44 * 6.2832 + qq * 2;
        g(POOL.charAt((i * 7 + j * 3) % POOL.length), c[0] + Math.cos(a) * rad, c[1] + Math.sin(a) * rad * 0.75, 18, 0, hsl(195 + 30 * j, 95, 78), al);
      }
    }
  }
  function drawCracks(Q) {
    if (S.hit <= 0.05) return;
    var c = Q.chest;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(190,240,255,0.95)';
    ctx.lineWidth = 2; ctx.globalAlpha = S.hit; ctx.lineJoin = 'round';
    for (var j = 0; j < 7; j++) {
      var a = j / 7 * 6.2832 + 0.3, len = (40 + 50 * hs(j)) * (1.2 - S.hit * 0.4);
      ctx.beginPath(); ctx.moveTo(c[0], c[1]);
      var x = c[0], y = c[1];
      for (var k = 1; k <= 3; k++) {
        x += Math.cos(a + (hs(j * 7 + k) - 0.5) * 0.9) * len / 3; y += Math.sin(a + (hs(j * 7 + k + 3) - 0.5) * 0.9) * len / 3;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWolf(t) {
    var E = env(), live = 1 - S.dis;
    var Q = rig(t, E);
    if (!WG) buildGlyphs(Q);
    drawBackdrop(t, E, live);
    drawRings(Q, E, false);
    drawHalo(Q, t, live);
    drawBody(Q, t);
    drawStrands(Q, E);
    drawFace(Q, E, t, live);
    drawRings(Q, E, true);
    drawCharge(Q, E);
    drawShock(Q);
    drawCracks(Q);
    if (S.atk >= 0.45) {
      beam(Q.core[0], Q.core[1], Q.hp, 430, clamp((S.atk - 0.45) / 0.5, 0, 1), 195, 80);
    }
  }

  /* ---------- kontrol ---------- */
  var LABELS = {
    idle: 'Siaga', howl: 'Raungan: gelombang simbol menyebar dari Equation Core',
    attack: 'Serangan: inti mengumpulkan energi, menerkam, lalu menembakkan sinar persamaan',
    hit: 'Kena damage', defeat: 'Dikalahkan: tubuh terurai menjadi angka dan simbol'
  };
  var labelEl = document.getElementById('label');
  function showLabel() { labelEl.innerHTML = '<b>' + (S.state === 'idle' ? 'Siaga' : S.state.toUpperCase()) + '</b> — ' + LABELS[S.state].replace(/^[^:]*:\s*/, ''); }

  function bodyPoint() { return [mx(300 + Math.random() * 120), my(250 + Math.random() * 120)]; }

  function setState(s) {
    if (!LABELS[s]) return;
    S.state = s;
    if (s === 'idle') { S.atk = -1; S.howl = -1; S.disTarget = 0; }
    else if (s === 'howl') {
      S.atk = -1; S.disTarget = 0; S.howl = 0;
      for (var i = 0; i < 26; i++) spawnWisp(mx(210) + Math.random() * 40, my(190) + Math.random() * 30, true);
    }
    else if (s === 'attack') { S.howl = -1; S.disTarget = 0; S.atk = 0; }
    else if (s === 'hit') { S.disTarget = 0; S.hit = 1; var bp = bodyPoint(); spawnBurst(bp[0], bp[1], 205, 30); }
    else if (s === 'defeat') {
      S.atk = -1; S.howl = -1; S.disTarget = 1; S.hit = 0;
      for (var j = 0; j < 60; j++) { var p = bodyPoint(); spawnWisp(p[0], p[1], true); }
    }
    showLabel();
  }
  window.WolfBoss = { setState: setState };

  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document && !(el.getAttribute && el.hasAttribute('data-set'))) el = el.parentNode;
    if (el && el !== document) setState(el.getAttribute('data-set'));
  });

  /* ---------- loop ---------- */
  function update(dt) {
    S.hit = Math.max(0, S.hit - dt / 0.7);
    if (S.atk >= 0) { S.atk += dt / 1.6; if (S.atk >= 1) S.atk = -1; }
    if (S.howl >= 0) { S.howl += dt / 2.6; if (S.howl >= 1) S.howl = -1; }
    S.flow += dt * (1 + (S.atk >= 0 ? 5 * Math.sin(Math.PI * S.atk) : 0) + 2.5 * S.hit + (S.howl >= 0 ? 3 * Math.sin(Math.PI * S.howl) : 0));
    if (S.dis < S.disTarget) S.dis = Math.min(S.disTarget, S.dis + dt / 2.4);
    else if (S.dis > S.disTarget) S.dis = Math.max(S.disTarget, S.dis - dt / 1.0);
    if (S.dis < 0.5) {
      S.wAcc += dt;
      if (S.wAcc > 0.09) { S.wAcc = 0; var bp = bodyPoint(); spawnWisp(bp[0], bp[1], false); }
    }
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.vx *= 0.985;
      if (p.life >= p.max) S.particles.splice(i, 1);
    }
    var done = (S.state === 'attack' && S.atk < 0) || (S.state === 'hit' && S.hit <= 0) || (S.state === 'howl' && S.howl < 0);
    if (done) { S.state = 'idle'; showLabel(); }
  }

  var last = null, t0 = null, ema = 0.016;
  function frame(now) {
    if (last === null) { last = now; t0 = now; }
    var raw = (now - last) / 1000;
    ema = ema * 0.92 + raw * 0.08;
    S.lite = ema > 0.03;
    var dt = Math.min(0.05, raw); last = now;
    S.t = (now - t0) / 1000;
    update(dt);

    var sh = (!RM && S.hit > 0) ? S.hit * 9 : 0;
    BX = sh ? (hs(Math.floor(S.t * 45)) - 0.5) * 2 * sh : 0;
    BY = sh ? (hs(Math.floor(S.t * 45) + 7) - 0.5) * 2 * sh : 0;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    baseT();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    curFont = '';
    ctx.globalAlpha = 1;
    drawWolf(S.t);
    drawParticles();
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { curFont = ''; });
  showLabel();
  requestAnimationFrame(frame);
  setTimeout(function () { setState('howl'); }, 400);   // intro: raungan saat halaman dibuka
})();
</script>
</body>
</html>
