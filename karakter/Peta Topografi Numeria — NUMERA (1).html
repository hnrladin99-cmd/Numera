$('#dm').onclick=()=>{const i=R.findIndex(r=>r.st=='open');if(i<0)R.forEach((r,k)=>r.st=INIT[k]);else{R[i].st='done';if(R[i+1])R[i+1].st='open'}nodes()};
window.NUMERA_MAP={setState(id,st){const r=R.find(r=>r.id==id);if(r){r.st=st;nodes()}}};
/* awan animasi */
const cc=$('#cl').getContext('2d'),sp=document.createElement('canvas');sp.width=sp.height=256;
(()=>{const s=sp.getContext('2d');let g=s.createRadialGradient(128,152,0,128,152,110);g.addColorStop(0,'rgba(135,150,195,.5)');g.addColorStop(1,'rgba(135,150,195,0)');s.fillStyle=g;s.fillRect(0,0,256,256);g=s.createRadialGradient(128,118,0,128,118,112);g.addColorStop(0,'rgba(255,255,255,.98)');g.addColorStop(.5,'rgba(250,252,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');s.fillStyle=g;s.fillRect(0,0,256,256)})();
R.forEach(r=>{r.cv=r.st=='lock'?1:0;r.pf=[];for(let k=0;k<40;k++){const c=k<10;r.pf.push({a:rnd()*6.283,rad:c?rnd()*.35:Math.sqrt(rnd()),w:(rnd()-.5)*.12,ax:14+rnd()*26,ay:8+rnd()*14,sp:.15+rnd()*.25,ph:rnd()*6.283,s:c?150+rnd()*50:90+rnd()*90,al:.6+rnd()*.38})}});
const AM=[];for(let k=0;k<7;k++)AM.push({o:rnd()*1600,v:8+rnd()*10,y:60+rnd()*560,s:110+rnd()*90});
let T0=performance.now(),last=T0;
function loop(now){const t=(now-T0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;cc.clearRect(0,0,W,H);
 AM.forEach(a=>{const x=((t*a.v+a.o)%(W+500))-250,y=a.y+Math.sin(t*.3+a.o)*8;cc.globalAlpha=.28;[[0,0,1],[a.s*.5,-a.s*.1,.75],[-a.s*.5,a.s*.05,.7]].forEach(q=>{const z=a.s*q[2];cc.drawImage(sp,x+q[0]-z/2,y+q[1]-z/2,z,z)})});
 R.forEach(r=>{const tg=r.st=='lock'?1:0;r.cv+=(tg-r.cv)*Math.min(1,dt*(tg?1.2:.7));if(r.cv<.01)return;const d=1-r.cv;
  r.pf.forEach(p=>{const an=p.a+t*p.w;let x=r.x+Math.cos(an)*p.rad*170+Math.cos(t*p.sp+p.ph)*p.ax,y=r.y+Math.sin(an)*p.rad*125+Math.sin(t*p.sp*.8+p.ph)*p.ay;
   const dx=x-r.x,dy=y-r.y,l=Math.hypot(dx,dy)||1;x+=dx/l*d*280;y+=dy/l*d*210-d*50;const z=p.s*(1+d*.4);cc.globalAlpha=p.al*r.cv;cc.drawImage(sp,x-z/2,y-z/2,z,z)})});
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
